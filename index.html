<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search TV shows with the TVMaze API and save your favorites.">
  <title>TV Show Explorer | CSE-2340 MP3-MP4</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>TV Show Explorer</h1>
    <p>Search shows, filter the results, and save your favorites.</p>
  </header>

  <main class="layout">
    <!-- SEARCH AREA -->
    <section id="search-section" class="panel" aria-labelledby="search-heading">
      <h2 id="search-heading">Search</h2>
      <form id="search-form" role="search">
        <label for="search-input" class="visually-hidden">Show title</label>
        <input id="search-input" type="search" placeholder="e.g. Breaking Bad, Friends, Sherlock" autocomplete="off" required>
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
    </section>

    <!-- STATUS MESSAGES: idle, loading, error, empty (filled by app.js) -->
    <section id="status-area" class="status-area" role="status" aria-live="polite"></section>

    <!-- RESULTS AREA -->
    <section id="results-section" class="panel" aria-labelledby="results-heading" hidden>
      <div class="section-header">
        <h2 id="results-heading">Results <span id="results-count" class="badge">0</span></h2>
        <div class="controls">
          <label for="genre-filter">Genre</label>
          <select id="genre-filter"><option value="all">All genres</option></select>
          <label for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="relevance">Best match</option>
            <option value="rating">Rating (high to low)</option>
            <option value="name">Name (A-Z)</option>
            <option value="year">Newest first</option>
          </select>
        </div>
      </div>
      <ul id="results-list" class="card-grid"></ul>
    </section>

    <!-- FAVORITES AREA (saved in localStorage) -->
    <section id="favorites-section" class="panel" aria-labelledby="favorites-heading">
      <div class="section-header">
        <h2 id="favorites-heading">My Favorites <span id="favorites-count" class="badge">0</span></h2>
        <button id="clear-favorites" class="btn btn-outline" type="button">Clear all</button>
      </div>
      <p id="favorites-empty" class="empty-note">No favorites yet. Click "Add to favorites" on any show.</p>
      <ul id="favorites-list" class="card-grid"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>CSE-2340 Software Development I, International Islamic University Chittagong. Data from <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener">TVMaze</a>.</p>
  </footer>

  <!-- Order matters: storage and api define functions that app.js uses -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
